name: Build OpalDesk

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release from main branch (public download without login)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      android_only:
        description: 'Build/release Android APK & opaldesk.jar only (skip macOS & Windows)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark manually dispatched GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

# Least-privilege default across all jobs (including pull_request)
permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK & Daemon JAR
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.build_apk.outputs.app_version }}
      app_version_code: ${{ steps.build_apk.outputs.app_version_code }}
      apk_name: ${{ steps.build_apk.outputs.apk_name }}
      is_signed: ${{ steps.build_apk.outputs.is_signed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup JDK 21 & Gradle Cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Android SDK Build-Tools & Platform 37.0
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT not found on runner"
            exit 1
          fi
          if [ ! -f "$SDK/platforms/android-37.0/android.jar" ] || [ ! -x "$SDK/build-tools/37.0.0/d8" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --sdk_root="$SDK" "platforms;android-37.0" "build-tools;37.0.0" || true
            fi
          fi
          test -f "$SDK/platforms/android-37.0/android.jar"
          test -x "$SDK/build-tools/37.0.0/d8"

      - name: Stage signing keystore file (never export password to GITHUB_ENV)
        shell: bash
        env:
          KS_B64_PRIMARY: ${{ secrets.OPALDESK_KEYSTORE_BASE64 }}
          HAS_KEYSTORE_PASS: ${{ secrets.OPALDESK_KEYSTORE_PASS != '' && '1' || '0' }}
          IS_RELEASE_PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' && github.ref == 'refs/heads/main')) && '1' || '0' }}
        run: |
          RAW_B64="${KS_B64_PRIMARY}"
          if [ "$IS_RELEASE_PUBLISH" = "1" ]; then
            echo "OPALDESK_REQUIRE_RELEASE_KEY=1" >> "$GITHUB_ENV"
            if [ -z "$RAW_B64" ] || [ "$HAS_KEYSTORE_PASS" != "1" ]; then
              echo "::error title=Missing Release Signing Secrets::请在仓库 Settings -> Secrets and variables -> Actions 中配置 OPALDESK_KEYSTORE_BASE64 与 OPALDESK_KEYSTORE_PASS 后再触发正式发版。"
              exit 1
            fi
          fi
          if [ -n "$RAW_B64" ] && [ "$HAS_KEYSTORE_PASS" = "1" ]; then
            KS_PATH="$RUNNER_TEMP/opaldesk.p12"
            if python3 - "$KS_PATH" <<'PY'
          import base64, os, re, sys
          raw = os.environ.get("KS_B64_PRIMARY") or ""
          m = re.search(r"MII[A-Za-z0-9+/=\s\-_]{400,}", raw)
          cand = m.group(0) if m else raw
          clean = re.sub(r"\s+", "", cand).replace("-", "+").replace("_", "/").strip("\"'")
          rem = len(clean) % 4
          if rem == 2:
              clean += "=="
          elif rem == 3:
              clean += "="
          data = base64.b64decode(clean, validate=True)
          if len(data) < 500 or data[0] != 0x30:
              raise ValueError(f"Decoded bytes length={len(data)} is not a valid PKCS#12 ASN.1 archive")
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          os.chmod(sys.argv[1], 0o600)
          print(f"Staged release keystore from GitHub Secrets ({len(data)} bytes).")
          PY
            then
              echo "OPALDESK_KEYSTORE=$KS_PATH" >> "$GITHUB_ENV"
            else
              if [ "$IS_RELEASE_PUBLISH" = "1" ]; then
                echo "::error title=Invalid Keystore Secret::Failed to decode OPALDESK_KEYSTORE_BASE64."
                exit 1
              else
                echo "::warning title=Invalid Keystore Secret::Keystore decode failed; falling back to unsigned CI verification build."
                echo "OPALDESK_ALLOW_UNSIGNED_RELEASE=1" >> "$GITHUB_ENV"
              fi
            fi
          else
            echo "OPALDESK_ALLOW_UNSIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "No keystore secrets configured; non-release CI will produce unsigned verification APK only."
          fi

      - name: Build & Test Android (:bridge & :helper)
        id: build_apk
        shell: bash
        env:
          OPALDESK_KEYSTORE_PASS: ${{ secrets.OPALDESK_KEYSTORE_PASS }}
          OPALDESK_EXPECTED_CERT_SHA256: ${{ secrets.OPALDESK_EXPECTED_CERT_SHA256 }}
          OPALDESK_SENTRY_DSN: ${{ secrets.OPALDESK_SENTRY_DSN }}
          OPALDESK_SENTRY_TUNNEL_URL: ${{ secrets.OPALDESK_SENTRY_TUNNEL_URL }}
          OPALDESK_FEEDBACK_STATUS_URL: ${{ secrets.OPALDESK_FEEDBACK_STATUS_URL }}
        run: |
          chmod +x ./gradlew
          GRADLE_ARGS=(
            :bridge:dexBridgeJar
            :bridge:test
            :helper:testDebugUnitTest
            :helper:assembleRelease
            --no-daemon
            --console=plain
          )
          if [ "${OPALDESK_ALLOW_UNSIGNED_RELEASE:-0}" = "1" ]; then
            GRADLE_ARGS+=(-PallowUnsignedRelease=true)
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

          VER="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' helper/build.gradle.kts | head -n 1)"
          VER="${VER:-0.0.1}"
          VER_CODE="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' helper/build.gradle.kts | head -n 1)"
          VER_CODE="${VER_CODE:-1}"

          mkdir -p build/out
          cp -f bridge/build/libs/opaldesk.jar build/out/opaldesk.jar

          SIGNED_APK="$(find helper/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' | head -n 1 || true)"
          UNSIGNED_APK="$(find helper/build/outputs/apk/release -maxdepth 1 -name '*-unsigned.apk' | head -n 1 || true)"

          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            APK_NAME="OpalDesk_v${VER}.apk"
            cp -f "$SIGNED_APK" "build/out/$APK_NAME"
            echo "APK_PATH=build/out/$APK_NAME" >> "$GITHUB_ENV"
            echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$UNSIGNED_APK" ] && [ -f "$UNSIGNED_APK" ]; then
            if [ "${OPALDESK_REQUIRE_RELEASE_KEY:-0}" = "1" ]; then
              echo "::error::Release publish requires signed APK, but only unsigned APK was produced!"
              exit 1
            fi
            APK_NAME="OpalDesk_v${VER}-unsigned.apk"
            cp -f "$UNSIGNED_APK" "build/out/$APK_NAME"
            echo "APK_PATH=build/out/$APK_NAME" >> "$GITHUB_ENV"
            echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No release APK found in helper/build/outputs/apk/release"
            exit 1
          fi

          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          ls -lh build/out

      - name: Cleanup temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/opaldesk.p12"

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpalDesk-Android_v${{ steps.build_apk.outputs.app_version }}
          path: |
            ${{ env.APK_PATH }}
            build/out/opaldesk.jar
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build & Test macOS Client (OpalDesk)
    if: ${{ !(github.event_name == 'workflow_dispatch' && format('{0}', github.event.inputs.android_only) == 'true') }}
    runs-on: macos-latest
    outputs:
      macos_archive_name: ${{ steps.package_macos.outputs.macos_archive_name }}
      app_version: ${{ steps.package_macos.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, Test & Package OpalDesk.app
        id: package_macos
        shell: bash
        env:
          OPALDESK_SENTRY_DSN: ${{ secrets.OPALDESK_SENTRY_DSN }}
          OPALDESK_SENTRY_TUNNEL_URL: ${{ secrets.OPALDESK_SENTRY_TUNNEL_URL }}
          OPALDESK_FEEDBACK_STATUS_URL: ${{ secrets.OPALDESK_FEEDBACK_STATUS_URL }}
        run: |
          VER="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' helper/build.gradle.kts | head -n 1)"
          VER="${VER:-0.0.1}"

          chmod +x scripts/build-macos-app.sh
          (
            cd macos/OpalDeskMac
            swift test
            swift build -c release
            ../../scripts/build-macos-app.sh --skip-build
          )

          ARCHIVE_NAME="OpalDesk_v${VER}-macos.zip"
          if [ ! -d "build/out/OpalDesk.app" ]; then
            echo "::error::scripts/build-macos-app.sh did not produce build/out/OpalDesk.app"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "build/out/OpalDesk.app" "build/out/$ARCHIVE_NAME"
          echo "MACOS_ARCHIVE_PATH=build/out/$ARCHIVE_NAME" >> "$GITHUB_ENV"
          echo "macos_archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          ls -lh build/out

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpalDesk-macOS_v${{ steps.package_macos.outputs.app_version }}
          path: ${{ env.MACOS_ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build & Test Windows Client (OpalDesk Tauri v2)
    if: ${{ !(github.event_name == 'workflow_dispatch' && format('{0}', github.event.inputs.android_only) == 'true') }}
    runs-on: windows-latest
    outputs:
      windows_setup_name: ${{ steps.package_windows.outputs.windows_setup_name }}
      windows_msi_name: ${{ steps.package_windows.outputs.windows_msi_name }}
      app_version: ${{ steps.package_windows.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, Test & Package OpalDesk Windows Installers
        id: package_windows
        shell: bash
        env:
          OPALDESK_SENTRY_DSN: ${{ secrets.OPALDESK_SENTRY_DSN }}
          OPALDESK_SENTRY_TUNNEL_URL: ${{ secrets.OPALDESK_SENTRY_TUNNEL_URL }}
          OPALDESK_FEEDBACK_STATUS_URL: ${{ secrets.OPALDESK_FEEDBACK_STATUS_URL }}
        run: |
          VER="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' helper/build.gradle.kts | head -n 1)"
          VER="${VER:-0.0.1}"

          if ! command -v cargo >/dev/null 2>&1; then
            rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
            rustup default stable-x86_64-pc-windows-msvc
          fi
          rustc --version
          cargo --version
          node --version

          (
            cd windows
            npm install --no-audit --no-fund
            node ./scripts/sync-frontend.mjs
            npm test
            cargo test --manifest-path src-tauri/Cargo.toml
            npx @tauri-apps/cli build
          )

          NSIS_EXE="$(find windows/src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' | head -n 1 || true)"
          MSI_PKG="$(find windows/src-tauri/target/release/bundle/msi -maxdepth 1 -name '*.msi' | head -n 1 || true)"

          if [ -z "$NSIS_EXE" ] || [ ! -f "$NSIS_EXE" ]; then
            echo "::error::Tauri build did not produce NSIS *-setup.exe installer"
            exit 1
          fi
          if [ -z "$MSI_PKG" ] || [ ! -f "$MSI_PKG" ]; then
            echo "::error::Tauri build did not produce WiX *.msi installer"
            exit 1
          fi

          mkdir -p build/out
          SETUP_NAME="OpalDesk_v${VER}-windows-x64-setup.exe"
          MSI_NAME="OpalDesk_v${VER}-windows-x64.msi"
          cp -f "$NSIS_EXE" "build/out/$SETUP_NAME"
          cp -f "$MSI_PKG" "build/out/$MSI_NAME"

          echo "WIN_SETUP_PATH=build/out/$SETUP_NAME" >> "$GITHUB_ENV"
          echo "WIN_MSI_PATH=build/out/$MSI_NAME" >> "$GITHUB_ENV"
          echo "windows_setup_name=$SETUP_NAME" >> "$GITHUB_OUTPUT"
          echo "windows_msi_name=$MSI_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          ls -lh build/out

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpalDesk-Windows_v${{ steps.package_windows.outputs.app_version }}
          path: |
            ${{ env.WIN_SETUP_PATH }}
            ${{ env.WIN_MSI_PATH }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows]
    if: >-
      always() &&
      needs.build-android.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify release preconditions & tag immutability
        env:
          GH_TOKEN: ${{ github.token }}
          IS_SIGNED: ${{ needs.build-android.outputs.is_signed }}
          APK_NAME: ${{ needs.build-android.outputs.apk_name }}
          TARGET_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build-android.outputs.app_version) }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$IS_SIGNED" != "true" ] || echo "$APK_NAME" | grep -q "unsigned"; then
            echo "::error::Refusing to publish unsigned APK ($APK_NAME) to GitHub Releases."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if gh api "repos/$REPO/releases/tags/$TARGET_TAG" >/dev/null 2>&1; then
              echo "::error::Release for tag $TARGET_TAG already exists; refusing to overwrite existing release via workflow_dispatch."
              exit 1
            fi
          fi

      - name: Download Verified Android Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpalDesk-Android_v${{ needs.build-android.outputs.app_version }}
          path: dist

      - name: Download Verified macOS Release Artifacts
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpalDesk-macOS_v${{ needs.build-macos.outputs.app_version }}
          path: dist

      - name: Download Verified Windows Release Artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpalDesk-Windows_v${{ needs.build-windows.outputs.app_version }}
          path: dist

      - name: Collect Release Asset Manifest
        id: assets
        shell: bash
        env:
          APK_NAME: ${{ needs.build-android.outputs.apk_name }}
          MACOS_ARCHIVE: ${{ needs.build-macos.outputs.macos_archive_name }}
          WIN_SETUP: ${{ needs.build-windows.outputs.windows_setup_name }}
          WIN_MSI: ${{ needs.build-windows.outputs.windows_msi_name }}
          HAS_MACOS: ${{ needs.build-macos.result == 'success' && '1' || '0' }}
          HAS_WINDOWS: ${{ needs.build-windows.result == 'success' && '1' || '0' }}
        run: |
          {
            echo "files<<EOF"
            echo "dist/${APK_NAME}"
            echo "dist/opaldesk.jar"
            if [ "$HAS_MACOS" = "1" ] && [ -n "$MACOS_ARCHIVE" ]; then
              echo "dist/${MACOS_ARCHIVE}"
            fi
            if [ "$HAS_WINDOWS" = "1" ] && [ -n "$WIN_SETUP" ] && [ -n "$WIN_MSI" ]; then
              echo "dist/${WIN_SETUP}"
              echo "dist/${WIN_MSI}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build-android.outputs.app_version) }}
          name: OpalDesk v${{ needs.build-android.outputs.app_version }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && format('{0}', github.event.inputs.prerelease) == 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}

      - name: Register Sentry Release (optional)
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          APP_VERSION: ${{ needs.build-android.outputs.app_version }}
          APP_VERSION_CODE: ${{ needs.build-android.outputs.app_version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT not fully configured; skipping Sentry release registration."
            exit 0
          fi
          export RELEASE_VER="io.github.lengsukq.opaldesk@${APP_VERSION}+${APP_VERSION_CODE}"
          PAYLOAD=$(python3 -c '
          import json, os
          print(json.dumps({
              "version": os.environ["RELEASE_VER"],
              "projects": [os.environ["SENTRY_PROJECT"]],
              "refs": [{"repository": os.environ["GITHUB_REPOSITORY"], "commit": os.environ["COMMIT_SHA"]}],
          }))
          ')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://us.sentry.io/api/0/organizations/${SENTRY_ORG}/releases/" >/dev/null || \
            echo "::warning::Sentry release registration failed (non-fatal)"
