[package]
name = "opaldesk-windows"
version = "1.0.23"
description = "OpalDesk Windows Companion Client (Tauri v2 + Edge WebView2)"
authors = ["Lengsu"]
license = "MIT"
repository = "https://github.com/lengsukq/OpalDesk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opaldesk_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
mdns-sd = "0.21"
sha2 = "0.10"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
