<!doctype html>
<html lang="zh-CN" data-theme="prism-pulse">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpalDesk · 通话浮窗</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "PingFang SC", sans-serif;
      color: #f4f7fd;
      user-select: none;
    }
    .hud-shell {
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      border-radius: 20px;
      background: linear-gradient(155deg, rgba(24, 30, 44, 0.90), rgba(14, 18, 28, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      -webkit-app-region: drag;
    }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hud-caller-wrap {
      min-width: 0;
      flex: 1;
    }
    .hud-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .hud-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(47, 143, 255, 0.22);
      color: #7cc0ff;
    }
    .hud-pill.ringing {
      background: rgba(251, 191, 36, 0.22);
      color: #fcd34d;
    }
    .hud-pill.offhook {
      background: rgba(52, 211, 153, 0.22);
      color: #6ee7b7;
    }
    .hud-caller {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-sub {
      font-size: 12px;
      color: rgba(215, 224, 240, 0.72);
      font-variant-numeric: tabular-nums;
    }
    .hud-dismiss {
      -webkit-app-region: no-drag;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(240, 245, 255, 0.85);
      border-radius: 999px;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .hud-dismiss:hover { background: rgba(255, 255, 255, 0.16); }
    .hud-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-btn {
      flex: 1;
      height: 36px;
      border: 0;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .hud-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .hud-btn:active { transform: scale(0.97); }
    .hud-btn.answer { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .hud-btn.danger { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .hud-btn.active { background: #2563eb; }
    .hud-sms-bar {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .hud-sms-chip {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-sms-chip:hover { background: rgba(47, 143, 255, 0.28); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="hud-shell">
    <div class="hud-top">
      <div class="hud-caller-wrap">
        <div class="hud-badge-row">
          <span class="hud-pill" id="hudStateBadge">来电</span>
          <span class="hud-sub" id="hudTimerText"></span>
        </div>
        <div class="hud-caller" id="hudCallerText">未知来电</div>
      </div>
      <button type="button" class="hud-dismiss" id="hudDismissBtn" title="仅暂时隐藏浮窗，不会挂断电话">暂隐</button>
    </div>

    <div class="hud-sms-bar" id="hudSmsBar" hidden></div>

    <div class="hud-actions" id="hudRingingActions" hidden>
      <button type="button" class="hud-btn answer" id="hudAnswerBtn">接听</button>
      <button type="button" class="hud-btn danger" id="hudRejectBtn">拒接</button>
      <button type="button" class="hud-btn" id="hudSmsToggleBtn">短信</button>
    </div>

    <div class="hud-actions" id="hudActiveActions" hidden>
      <button type="button" class="hud-btn" id="hudMuteBtn">静音</button>
      <button type="button" class="hud-btn" id="hudSpeakerBtn">扬声器</button>
      <button type="button" class="hud-btn danger" id="hudHangupBtn">挂断</button>
    </div>
  </div>
  <script type="module" src="./js/call_hud_controller.js"></script>
</body>
</html>
